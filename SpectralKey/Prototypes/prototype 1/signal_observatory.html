<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="Style.css">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SpectralKey</title>
</head>
<body>
<header><div><h1 class="brand"><img src="assets/spectralkey-logo.png" alt="" width="68" height="68"><span>Spectral Key</span></h1></div></header>
<main>
  <section class="stats"><div class="stat"><b id="total">0</b><span>events captured</span></div></section>
  <div class="toolbar">
    <button class="btn primary" id="add" disabled title="Unavailable in the static preview">+ Log signal</button>
    <button class="btn" id="refresh" disabled title="Unavailable in the static preview">Refresh</button>
  </div>
  <div class="layout">
    <section class="panel"><div class="panel-title"><h2>Observation timeline</h2><div class="filters">
      <!--<select id="filter" disabled title="Unavailable in the static preview" aria-label="Filter by classification"></select> -->
    </div></div><div class="table-wrap"><table><thead><tr><th>Frequency</th><th>UTC / receiver</th><th>Mode & evidence</th><th>Assessment</th></tr></thead>
      <tbody id="events"></tbody></table><div class="empty" id="empty">Static preview. Signal logging is not connected.</div></div></section>
    
  </div>
</main>
</body></html>
